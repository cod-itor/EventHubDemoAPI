<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"
            rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="flex justify-center items-center h-screen">
    <form class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
            Add New Employee
        </h2>

        <div class="mb-6">
            <label
                    for="firstName"
                    class="block mb-2 text-sm font-medium text-gray-900"
            >First Name</label
            >
            <input
                    type="text"
                    id="firstName"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    placeholder="First Name"
                    required
            />
        </div>

        <div class="mb-6">
            <label
                    for="lastName"
                    class="block mb-2 text-sm font-medium text-gray-900"
            >Last Name</label
            >
            <input
                    type="text"
                    id="lastName"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    placeholder="Last Name"
                    required
            />
        </div>

        <div class="mb-6">
            <label
                    for="email"
                    class="block mb-2 text-sm font-medium text-gray-900"
            >Email Address</label
            >
            <input
                    type="email"
                    id="email"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    placeholder="example@gmail.com"
                    required
            />
        </div>

        <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 text-white font-medium rounded-lg text-sm px-5 py-2.5"
        >
            Add
        </button>
    </form>
</div>
</body>
</html>
