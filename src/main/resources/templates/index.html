<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-semibold text-gray-700">Manage Employees</h1>
                <a
                        href="#"
                        class="text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 font-medium rounded-lg text-sm px-4 py-2.5"
                >Add</a
                >
            </div>
            <div class="mt-6">
                <table class="w-full table-auto">
                    <thead class="bg-gray-100">
                    <tr class="text-left text-sm text-gray-600">
                        <th class="px-6 py-4 font-medium text-gray-900">No</th>
                        <th class="px-6 py-4 font-medium text-gray-900">
                            First Name
                        </th>
                        <th class="px-6 py-4 font-medium text-gray-900">Last Name</th>
                        <th class="px-6 py-4 font-medium text-gray-900">Email</th>
                        <th class="px-6 py-4 font-medium text-gray-900">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="text-sm text-gray-600">
                    <tr class="border-b">
                        <td class="px-6 py-4">1</td>
                        <td class="px-6 py-4">example</td>
                        <td class="px-6 py-4">example</td>
                        <td class="px-6 py-4">example@gmail.com</td>
                        <td class="px-6 py-4 space-x-2">
                            <a
                                    href="#"
                                    class="text-white bg-blue-600 hover:bg-blue-700 rounded-lg px-4 py-2 text-xs focus:ring-4 focus:ring-blue-300"
                            >View</a
                            >
                            <a
                                    href="#"
                                    class="text-white bg-green-600 hover:bg-green-700 rounded-lg px-4 py-2 text-xs focus:ring-4 focus:ring-green-300"
                            >Edit</a
                            >
                            <a
                                    href="#"
                                    class="text-white bg-red-600 hover:bg-red-700 rounded-lg px-4 py-2 text-xs focus:ring-4 focus:ring-red-300"
                            >Delete</a
                            >
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
